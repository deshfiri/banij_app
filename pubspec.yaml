name: bbnij
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 2.0.0+1

environment:
  sdk: ^3.13.7


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  auto_animated: ^3.2.0
  flutter_displaymode: ^0.7.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  get_storage: ^2.1.1
  provider: ^6.1.5
  get_it: ^8.0.3
  intl: ^0.19.0
  device_info_plus: ^13.3.0
  dio: ^5.8.0+1
  rxdart: ^0.28.0
  flutter_svg: ^2.2.0
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  pinput: ^5.0.1

  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_speed_dial: ^7.0.0
  google_fonts: ^6.2.1
  flutter_slidable: ^4.0.0
  dropdown_button2: ^2.3.9
  shared_preferences: ^2.5.3
  fl_chart: ^0.68.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  lottie: ^3.1.2



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21


flutter:


  uses-material-design: true

  assets:
      - assets/images/
      - assets/icons/
      - assets/fonts/
      - assets/animations/

  fonts:
    - family: LiAdor
      fonts:
        - asset: assets/fonts/LiAdor.ttf
